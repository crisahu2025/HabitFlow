name: Compilar APK Android HabitFlow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar Dependencias
        run: |
          npm install

      - name: Preparar Web Assets para Capacitor
        run: |
          node scripts/prepare_www.js

      - name: Sincronizar Capacitor Android
        run: |
          npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: |
          chmod +x android/gradlew

      - name: Compilar APK de Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HabitFlow.apk

      - name: Subir Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-Android-APK
          path: HabitFlow.apk
          retention-days: 30

      - name: Crear Release con el APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HabitFlow v1.0.${{ github.run_number }} (APK Instalable)
          body: |
            ### 📱 HabitFlow v1.0.${{ github.run_number }} para Android
            - 🔑 **Firma Criptográfica Fija (Keystore Permanente):** Resuelve permanentemente el conflicto de instalación entre versiones.
            - ⚙️ **Nueva Pestaña de Ajustes (Configuración):** Edición de perfil, peso y meta personalizada con fórmula de Frank Suárez.
            - 🌙 / ☀️ **Modo Nocturno y Modo Soleado:** Alternancia instantánea de tema oscuro y claro.
            - 📊 **Tus Cosas:** Estadísticas acumuladas históricas (litros totales, racha máxima, vasos y energía celular ATP).
            - 🤖 **Logo Oficial 3D:** Creado con Nano Banana Pro e implementado en todas las resoluciones Android.
            - 🔔 **Recordatorios de Fondo:** Motor nativo de notificaciones locales de hidratación.
            
            > ⚠️ **Aviso de instalación por única vez:** Si tenés una versión previa instalada en tu teléfono, por favor desinstalala primero antes de instalar este APK para que Android adopte la firma criptográfica permanente. A partir de esta versión, todas las futuras actualizaciones se instalarán encima automáticamente sin desinstalar.
            
            **Descargá e instalá el archivo HabitFlow.apk:**
          files: HabitFlow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
