name: Compilar APK Android HabitFlow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar Dependencias
        run: |
          npm install

      - name: Preparar Web Assets para Capacitor
        run: |
          node scripts/prepare_www.js

      - name: Sincronizar Capacitor Android
        run: |
          npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: |
          chmod +x android/gradlew

      - name: Compilar APK de Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HabitFlow.apk

      - name: Subir Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-Android-APK
          path: HabitFlow.apk
          retention-days: 30

      - name: Empaquetar Parche OTA (dist.zip)
        run: |
          cd www
          zip -r ../dist.zip .
          cd ..

      - name: Crear Release con el APK y Parche OTA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HabitFlow v1.0.${{ github.run_number }} (APK + Parche OTA)
          body: |
            ### 📱 HabitFlow v1.0.${{ github.run_number }}
            - ⚡ **Motor de Parches en Vivo OTA (Capgo):** Descargas en 1 segundo y reinicio instantáneo sin pasar por instalador de Android ni Play Protect.
            - 💧 **Auto-Distribución de los 14 Vasos (Frank Suárez):** Reparto automático de tus 14 tomas a lo largo del día.
            - 🔔 **Notificaciones con Acciones Rápidas:** Botones "Tomé el Agua" (+250ml) y "Posponer 10 Min".
            - 💧 **Ícono de Gota de Agua Personalizado:** Identidad visual única de HabitFlow.
            - 🔑 **Firma Criptográfica Permanente**.
            
            **Archivos de entrega:**
            - `HabitFlow.apk`: Instalador APK base para Android
            - `dist.zip`: Parche OTA liviano en caliente
          files: |
            HabitFlow.apk
            dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
