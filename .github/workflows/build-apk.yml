name: Compilar APK Android HabitFlow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar Dependencias
        run: |
          npm install

      - name: Preparar Web Assets para Capacitor
        run: |
          node scripts/prepare_www.js

      - name: Sincronizar Capacitor Android
        run: |
          npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: |
          chmod +x android/gradlew

      - name: Compilar APK de Android (Release)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk HabitFlow.apk

      - name: Subir Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-Android-APK
          path: HabitFlow.apk
          retention-days: 30

      - name: Obtener Versión del Proyecto
        id: get_version
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          echo "APP_VER=v$APP_VER" >> $GITHUB_OUTPUT
          echo "Versión del proyecto: v$APP_VER"

      - name: Crear Release Oficial con el APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.APP_VER }}
          name: HabitFlow ${{ steps.get_version.outputs.APP_VER }} (APK Oficial)
          body: |
            ### 📱 HabitFlow ${{ steps.get_version.outputs.APP_VER }}
            - 🛡️ **Firma Release de Producción:** APK oficial firmado con keystore corporativo de Code Ahumada (`assembleRelease`).
            - 💧 **Acciones Silenciosas en Notificaciones:** "Tomé el Agua" (+250ml) y "Posponer 10 Min" registran en segundo plano sin abrir la app.
            - ⚡ **Actualizador Nativo Directo:** Instalación confiable mediante el instalador nativo de Android.
            
            **Instalador:**
            - `HabitFlow.apk`: Instalador APK oficial para Android
          files: |
            HabitFlow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

